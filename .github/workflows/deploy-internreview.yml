name: Deploy amelia-internReview (parityrfp.com/amelia-internReview)

# Deploys the app to parityrfp.com/amelia-internReview/ for intern review.
# Reuses the same parity FTP login and the existing cs/amelias MySQL database
# (STAGING_* secrets). The app is base-path aware via BASE_PATH in .env, so it
# routes correctly from the /amelia-internReview subdirectory.
#
# Mirrors deploy-staging.yml's vetted flat-bundle layout (public/ at the mount
# root, support dirs alongside and denied by .htaccess).
#
# Secrets (gh secret set): STAGING_FTP_SERVER, STAGING_FTP_USERNAME,
#   STAGING_FTP_PASSWORD, STAGING_APP_KEY, STAGING_DB_HOST, STAGING_DB_NAME,
#   STAGING_DB_USER, STAGING_DB_PASS

# Manual-trigger only — does NOT auto-deploy on push. Run it deliberately
# (Actions tab → "Run workflow", or `gh workflow run`) once secrets are set.
on:
  workflow_dispatch:

concurrency:
  group: deploy-internreview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, json
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || echo "no composer deps yet"

      - name: Assemble flat deploy bundle (dist/)
        run: |
          mkdir -p dist
          # public/ contents become the web-accessible mount root
          cp -r public/. dist/
          # support dirs sit alongside (denied to the web by .htaccess)
          for d in includes src config db templates cron audit; do
            [ -d "$d" ] && cp -r "$d" dist/
          done
          # Menu seed data (db/seed.php parses these) — needed on the server.
          mkdir -p dist/docs/content
          [ -d docs/content/menus ] && cp -r docs/content/menus dist/docs/content/
          [ -d vendor ] && cp -r vendor dist/ || true
          [ -f composer.json ] && cp composer.json dist/ || true
          # Strip the Pages-only landing files (not part of the app).
          rm -f dist/../index.html 2>/dev/null || true
          # Runtime env — features off (no real secrets); BASE_PATH makes the
          # router + url() helper work from the /amelia-internReview subdir.
          cat > dist/.env <<EOF
          APP_NAME=Amelia's by EAT (intern review)
          APP_ENV=staging
          APP_DEBUG=false
          APP_URL=https://parityrfp.com/amelia-internReview
          BASE_PATH=/amelia-internReview
          APP_KEY=base64:${{ secrets.STAGING_APP_KEY }}
          DB_HOST=${{ secrets.STAGING_DB_HOST }}
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASS=${{ secrets.STAGING_DB_PASS }}
          EOF

      - name: FTP deploy to parityrfp.com/amelia-internReview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          server-dir: /amelia-internReview/
          local-dir: ./dist/
          protocol: ftp
          port: 21

      - name: Smoke-check
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://parityrfp.com/amelia-internReview/ || echo "000")
          echo "Home returned HTTP $code"
          [ "$code" = "200" ] || echo "::warning::amelia-internReview home returned $code (review deploy)"
